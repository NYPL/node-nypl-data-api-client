---
name: Test and deploy
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up node
        uses: actions/setup-node@v3
        with:
          cache: 'npm'
      - name: Install dependencies
        run: npm i
      - name: Run linter and test suite
        run: npm test
...
